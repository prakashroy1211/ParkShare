<!-- core/templates/core/view_reservations.html -->
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkShare - View Reservations</title>
    <link rel="stylesheet" href="{% static 'css/view_reservations.css' %}">
</head>
<body>
    <div class="nav-bar">
        <h2>ParkShare</h2>
        <a href="{% url 'user_dashboard' %}?tab_id={{ request.GET.tab_id|default:'default' }}">Dashboard</a>
        <a href="#">View Profile</a>
    </div>
    <div class="dashboard-content">
        <div class="top-bar">
            <div class="user-profile">
                <img src="{% static 'images/user.png' %}" alt="User">
                <span>{{ user.username }}</span>
            </div>
        </div>
        <div class="logout-container">
            <form id="logout-form" method="POST" action="{% url 'logout' %}?tab_id={{ request.GET.tab_id|default:'default' }}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
        <div class="content-wrapper">
            <h2>Your Reservations</h2>
            <div id="reservationsList"></div>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const tabId = sessionStorage.getItem('tab_id') || urlParams.get('tab_id') || 'default';
        sessionStorage.setItem('tab_id', tabId);

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== "") {
                const cookies = document.cookie.split(";");
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + "=")) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        async function fetchCsrfToken() {
            try {
                const response = await fetch(`/api/get-csrf-token/?tab_id=${tabId}`, {
                    method: 'GET',
                    credentials: 'include'
                });
                if (!response.ok) {
                    throw new Error(`Failed to fetch CSRF token: ${response.status}`);
                }
                const data = await response.json();
                if (data.csrf_token) {
                    document.cookie = `csrftoken=${data.csrf_token}; path=/; SameSite=Lax`;
                    return data.csrf_token;
                }
                throw new Error("CSRF token not returned");
            } catch (error) {
                console.error("Error fetching CSRF token:", error);
                return null;
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            fetch(`/api/user-reservations/?tab_id=${tabId}`, {
                method: 'GET',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken') || document.querySelector('[name=csrfmiddlewaretoken]')?.value,
                },
                credentials: 'include'
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    displayReservations(data.reservations);
                } else {
                    console.error('Error fetching reservations:', data.message);
                    document.getElementById('reservationsList').innerHTML = '<p>No reservations found.</p>';
                }
            })
            .catch(error => {
                console.error('Error fetching reservations:', error);
                document.getElementById('reservationsList').innerHTML = '<p>Error loading reservations: ' + error.message + '</p>';
            });
        });

        function displayReservations(reservations) {
            const reservationsList = document.getElementById('reservationsList');
            reservationsList.innerHTML = '';
            if (reservations.length === 0) {
                reservationsList.innerHTML = '<p>No reservations found.</p>';
                return;
            }

            reservations.forEach(reservation => {
                const resDiv = document.createElement('div');
                resDiv.className = 'reservation-item';
                resDiv.innerHTML = `
                    <strong>${reservation.lot_name}</strong><br>
                    Location: ${reservation.location}<br>
                    Reserved on: ${new Date(reservation.timestamp).toLocaleString()}<br>
                    Status: ${reservation.status}
                `;
                reservationsList.appendChild(resDiv);
            });
        }

        document.getElementById('logout-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            try {
                let csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie("csrftoken");
                const freshCsrfToken = await fetchCsrfToken();
                if (freshCsrfToken) {
                    csrfToken = freshCsrfToken;
                }
                if (!csrfToken) {
                    throw new Error("CSRF token missing. Please refresh the page and try again.");
                }

                const response = await fetch(`/logout/?tab_id=${tabId}`, {
                    method: 'POST',
                    headers: {
                        'X-CSRFToken': csrfToken,
                    },
                    credentials: 'include'
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }

                const responseData = await response.json();
                if (responseData.message === "Logout successful") {
                    if (responseData.csrf_token) {
                        document.cookie = `csrftoken=${responseData.csrf_token}; path=/; SameSite=Lax`;
                    }
                    sessionStorage.removeItem("user");
                    sessionStorage.removeItem("tab_id");
                    sessionStorage.removeItem("reservations");
                    window.location.href = `/login/?tab_id=${tabId}`;
                } else {
                    throw new Error(responseData.message || "Logout failed");
                }
            } catch (error) {
                console.error("Error during logout:", error);
                alert("Error during logout: " + error.message);
            }
        });
    </script>
</body>
</html>
