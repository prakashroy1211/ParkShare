<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkShare - Dashboard</title>
    <link rel="stylesheet" href="{% static 'css/user_dashboard.css' %}">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        #map { height: 600px; width: 100%; } /* Adjust map height as needed */
        .content-wrapper { display: flex; flex-wrap: wrap; }
        .left-section { flex: 1; min-width: 300px; padding: 10px; }
        .right-section { flex: 2; min-width: 300px; padding: 10px; }
        .parking-slot { margin: 10px 0; padding: 10px; border: 1px solid #ccc; border-radius: 5px; }
        .available { background-color: #28a745; color: white; }
        .unavailable { background-color: #dc3545; color: white; }
    </style>
</head>
<body>
    <!-- Left Navigation Bar -->
    <div class="nav-bar">
        <h2>ParkShare</h2>
        <a href="{% url 'view_reservations' %}?tab_id={{ request.GET.tab_id|default:'default' }}">View Reservations</a>
        <a href="#">View Profile</a>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-content">
        <!-- Top Bar with Search and Profile -->
        <div class="top-bar">
            <div class="search-bar">
                <input type="text" id="searchLocation" placeholder="Search Location..." />
                <button onclick="searchLocation()">Search</button>
            </div>
            <div class="user-profile">
                <img src="{% static 'images/user.png' %}" alt="User">
                <span>{{ user.username }}</span>
            </div>
        </div>
        <div class="logout-container">
            <form id="logout-form" method="POST" action="{% url 'logout' %}?tab_id={{ request.GET.tab_id|default:'default' }}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
        <!-- Dashboard Content Wrapper -->
        <div class="content-wrapper">
            <!-- Left Section: Available Parking Slots -->
            <div class="left-section">
                <div class="available-parking" id="parkingSlots">
                    <h3>Available Parking Lots</h3>
                    <!-- Parking slots will be dynamically added here -->
                </div>
            </div>
            <!-- Right Section: Map Section with Leaflet -->
            <div class="right-section">
                <div class="map-section" id="mapContainer">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
        // Get tab_id from sessionStorage or URL
        const urlParams = new URLSearchParams(window.location.search);
        const tabId = sessionStorage.getItem('tab_id') || urlParams.get('tab_id') || 'default';
        sessionStorage.setItem('tab_id', tabId);

        // Initialize Leaflet map with a default view (e.g., India center)
        const map = L.map('map').setView([20.5937, 78.9629], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Custom icons for markers
        const greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            shadowSize: [41, 41]
        });

        const redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png',
            shadowSize: [41, 41]
        });

        // Store markers to update them later
        const markers = {};

        // Search Location Function (focus map without adding a marker)
        function searchLocation() {
            const searchQuery = document.getElementById('searchLocation').value;
            if (searchQuery) {
                const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(searchQuery)}&limit=1`;
                fetch(geocodeUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            const lat = parseFloat(data[0].lat);
                            const lon = parseFloat(data[0].lon);
                            map.setView([lat, lon], 13); // Focus map on searched location
                        } else {
                            alert("Location not found");
                        }
                    })
                    .catch(error => {
                        console.error('Error searching location:', error);
                        alert("Error searching location");
                    });
            }
        }

        // Fetch and display parking lots on page load
        document.addEventListener('DOMContentLoaded', function() {
            fetch(`/api/list-all-parking-lots/?tab_id=${tabId}`, {
                method: 'GET',
                headers: {
                    'X-CSRFToken': getCookie('csrftoken') || document.querySelector('[name=csrfmiddlewaretoken]')?.value,
                },
                credentials: 'include'
            })
            .then(response => {
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                return response.json();
            })
            .then(data => {
                if (data.status === 'success') {
                    displayParkingLots(data.parking_lots);
                } else {
                    console.error('Error fetching parking lots:', data.message);
                    document.getElementById('parkingSlots').innerHTML += '<p>No parking lots available.</p>';
                }
            })
            .catch(error => {
                console.error('Error fetching parking lots:', error);
                document.getElementById('parkingSlots').innerHTML += '<p>Error loading parking lots: ' + error.message + '</p>';
            });
        });

        // Display parking lots in the UI and on the map
        function displayParkingLots(parkingLots) {
            const parkingSlotsContainer = document.getElementById('parkingSlots');
            parkingSlotsContainer.innerHTML = '<h3>Available Parking Lots</h3>';

            if (parkingLots.length === 0) {
                parkingSlotsContainer.innerHTML += '<p>No parking lots available.</p>';
                return;
            }

            parkingLots.forEach(lot => {
                // Create parking slot UI
                const slotDiv = document.createElement('div');
                slotDiv.className = 'parking-slot';
                slotDiv.id = `parking-slot-${lot.id}`;
                slotDiv.innerHTML = `
                    <div>
                        <strong>${lot.lot_name}</strong><br>
                        Location: ${lot.location_name}<br>
                        Vehicle Type: ${lot.vehicle_type}<br>
                        Capacity: <span id="capacity-${lot.id}">${lot.vehicle_capacity}</span><br>
                        Price per Hour: Rs ${lot.price_per_hour}
                    </div>
                    <button onclick="reserveParkingLot(${lot.id}, '${lot.lot_name.replace(/'/g, "\\'")}', '${lot.location_name.replace(/'/g, "\\'")}', ${lot.latitude}, ${lot.longitude})"
                            class="${lot.vehicle_capacity > 0 ? 'available' : 'unavailable'}"
                            ${lot.vehicle_capacity <= 0 ? 'disabled' : ''}>
                        Reserve
                    </button>
                `;
                parkingSlotsContainer.appendChild(slotDiv);

                // Add or update marker on the map
                if (lot.latitude && lot.longitude) {
                    const markerIcon = lot.vehicle_capacity > 0 ? greenIcon : redIcon;
                    if (markers[lot.id]) {
                        markers[lot.id].setIcon(markerIcon);
                    } else {
                        markers[lot.id] = L.marker([lot.latitude, lot.longitude], { icon: markerIcon })
                            .addTo(map)
                            .bindPopup(`<b>${lot.lot_name}</b><br>${lot.location_name}<br>Capacity: ${lot.vehicle_capacity}`)
                            .on('click', () => map.setView([lot.latitude, lot.longitude], 13));
                    }
                } else {
                    console.warn(`No coordinates for parking lot: ${lot.lot_name}`);
                }
            });
        }

        // Reserve a parking lot
        async function reserveParkingLot(parkingLotId, lotName, location, latitude, longitude) {
            try {
                let csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie("csrftoken");
                const freshCsrfToken = await fetchCsrfToken();
                if (freshCsrfToken) csrfToken = freshCsrfToken;

                if (!csrfToken) throw new Error("CSRF token missing. Please refresh the page and try again.");

                const response = await fetch(`/api/reserve-parking-lot/?tab_id=${tabId}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken,
                    },
                    body: JSON.stringify({ parking_lot_id: parkingLotId }),
                    credentials: 'include'
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.message || `HTTP error! status: ${response.status}`);

                if (data.status === 'success') {
                    alert(data.message);
                    const capacityElement = document.getElementById(`capacity-${parkingLotId}`);
                    if (capacityElement) {
                        capacityElement.textContent = data.updated_capacity;
                    }
                    const button = document.querySelector(`#parking-slot-${parkingLotId} button`);
                    if (button) {
                        if (data.updated_capacity <= 0) {
                            button.className = 'unavailable';
                            button.disabled = true;
                            if (markers[parkingLotId]) {
                                markers[parkingLotId].setIcon(redIcon);
                                markers[parkingLotId].setPopupContent(`<b>${lotName}</b><br>${location}<br>Capacity: ${data.updated_capacity}`);
                            }
                        }
                    }

                    const reservation = {
                        id: parkingLotId,
                        lot_name: lotName,
                        location: location,
                        timestamp: new Date().toISOString(),
                        status: 'Active'
                    };
                    let reservations = JSON.parse(sessionStorage.getItem('reservations') || '[]');
                    reservations.push(reservation);
                    sessionStorage.setItem('reservations', JSON.stringify(reservations));
                } else {
                    throw new Error(data.message || 'Reservation failed');
                }
            } catch (error) {
                console.error('Reservation failed:', error);
                alert(`Error reserving parking lot: ${error.message}`);
            }
        }

        // Fetch a fresh CSRF token
        async function fetchCsrfToken() {
            try {
                const response = await fetch(`/api/get-csrf-token/?tab_id=${tabId}`, {
                    method: 'GET',
                    credentials: 'include'
                });
                if (!response.ok) throw new Error(`Failed to fetch CSRF token: ${response.status}`);
                const data = await response.json();
                if (data.csrf_token) {
                    document.cookie = `csrftoken=${data.csrf_token}; path=/; SameSite=Lax`;
                    return data.csrf_token;
                }
                throw new Error("CSRF token not returned");
            } catch (error) {
                console.error("Error fetching CSRF token:", error);
                return null;
            }
        }

        // Helper function to get CSRF token from cookies
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let cookie of cookies) {
                    cookie = cookie.trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        // Handle logout
        document.getElementById('logout-form').addEventListener('submit', async function(event) {
            event.preventDefault();
            try {
                let csrfToken = document.querySelector('[name=csrfmiddlewaretoken]')?.value || getCookie("csrftoken");
                const freshCsrfToken = await fetchCsrfToken();
                if (freshCsrfToken) csrfToken = freshCsrfToken;

                if (!csrfToken) throw new Error("CSRF token missing. Please refresh the page and try again.");

                const response = await fetch(`/logout/?tab_id=${tabId}`, {
                    method: 'POST',
                    headers: { 'X-CSRFToken': csrfToken },
                    credentials: 'include'
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
                }

                const responseData = await response.json();
                if (responseData.message === "Logout successful") {
                    if (responseData.csrf_token) {
                        document.cookie = `csrftoken=${responseData.csrf_token}; path=/; SameSite=Lax`;
                    }
                    sessionStorage.removeItem("user");
                    sessionStorage.removeItem("tab_id");
                    sessionStorage.removeItem("reservations");
                    window.location.href = `/login/?tab_id=${tabId}`;
                } else {
                    throw new Error(responseData.message || "Logout failed");
                }
            } catch (error) {
                console.error("Error during logout:", error);
                alert("Error during logout: " + error.message);
            }
        });
    </script>
</body>
</html>
