<!-- core/templates/core/owner_reservations.html -->
<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Owner Reservations - ParkShare</title>
    <link rel="stylesheet" href="{% static 'css/owner_dashboard.css' %}"> <!-- Reuse owner_dashboard.css -->
    <style>
        .reservation-item {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <!-- CSRF Token -->
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}" id="csrf-token">

    <!-- Sidebar -->
    <div class="nav-bar">
        <h2>ParkShare</h2>
        <a href="{% url 'owner_dashboard' %}?tab_id={{ request.GET.tab_id|default:'default' }}">My Parking Lots</a>
        <a href="{% url 'owner_reservations' %}?tab_id={{ request.GET.tab_id|default:'default' }}" class="active">Reservations</a>
    </div>

    <!-- Main Content -->
    <div class="dashboard-content">
        <!-- Top Bar -->
        <div class="top-bar">
            <h1>Reservations for My Parking Lots</h1>
        </div>

        <!-- User Profile -->
        <div class="user-profile">
            <img src="{% static 'images/user.png' %}" alt="User">
            <span>{{ user.username }}</span>
        </div>

        <!-- Logout Container -->
        <div class="logout-container">
            <form id="logout-form" method="POST" action="{% url 'logout' %}?tab_id={{ request.GET.tab_id|default:'default' }}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>

        <!-- Reservations List -->
        <div id="reservations-list">
            <p>Loading reservations...</p>
        </div>
    </div>

    <script>
    const urlParams = new URLSearchParams(window.location.search);
    const tabId = sessionStorage.getItem('tab_id') || urlParams.get('tab_id') || 'default';
    sessionStorage.setItem('tab_id', tabId);

    // Get CSRF Token
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    function getCsrfToken() {
        const token = document.querySelector('#csrf-token')?.value || getCookie('csrftoken');
        if (!token || token.length !== 64) {
            console.error('Invalid or missing CSRF token');
            throw new Error('CSRF token is missing or invalid');
        }
        return token;
    }

    async function fetchCsrfToken() {
        try {
            const response = await fetch(`/api/get-csrf-token/?tab_id=${tabId}`, {
                method: 'GET',
                credentials: 'include'
            });
            if (!response.ok) throw new Error(`Failed to fetch CSRF token: ${response.status}`);
            const data = await response.json();
            if (data.csrf_token) {
                document.cookie = `csrftoken=${data.csrf_token}; path=/; SameSite=Lax`;
                return data.csrf_token;
            }
            throw new Error("CSRF token not returned");
        } catch (error) {
            console.error("Error fetching CSRF token:", error);
            return null;
        }
    }

    // Fetch and Display Reservations
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch(`/api/owner-reservations/?tab_id=${tabId}`, {
                method: 'GET',
                headers: {
                    'X-CSRFToken': getCsrfToken(),
                },
                credentials: 'include'
            });

            if (!response.ok) {
                const errorText = await response.text();
                throw new Error(`Failed to fetch reservations: ${response.status} - ${errorText}`);
            }

            const data = await response.json();
            const reservationsList = document.getElementById('reservations-list');
            reservationsList.innerHTML = '';

            if (data.status === 'success' && data.reservations.length > 0) {
                data.reservations.forEach(res => {
                    const resDiv = document.createElement('div');
                    resDiv.className = 'reservation-item';
                    resDiv.innerHTML = `
                        <h3>${res.lot_name}</h3>
                        <p>Location: ${res.location}</p>
                        <p>Reserved by: ${res.user}</p>
                        <p>Status: ${res.status}</p>
                        <p>Created: ${new Date(res.created_at).toLocaleString()}</p>
                        <p>Slot Number: ${res.slot_number}</p>
                        <p>Start Time: ${res.start_time === 'N/A' ? 'N/A' : new Date(res.start_time).toLocaleString()}</p>
                        <p>End Time: ${res.end_time === 'N/A' ? 'N/A' : new Date(res.end_time).toLocaleString()}</p>
                        <p>Vehicle ID: ${res.vehicle_id}</p>
                    `;
                    reservationsList.appendChild(resDiv);
                });
            } else {
                reservationsList.innerHTML = '<p>No reservations found for your parking lots.</p>';
            }
        } catch (error) {
            console.error('Error fetching reservations:', error);
            document.getElementById('reservations-list').innerHTML = `<p>Error loading reservations: ${error.message}</p>`;
        }
    });

    // Logout Handler
    document.getElementById('logout-form').addEventListener('submit', async function(event) {
        event.preventDefault();
        try {
            let csrfToken = document.querySelector('#csrf-token')?.value || getCookie("csrftoken");
            const freshCsrfToken = await fetchCsrfToken();
            if (freshCsrfToken) csrfToken = freshCsrfToken;

            if (!csrfToken) throw new Error("CSRF token missing. Please refresh the page.");

            const response = await fetch(`/logout/?tab_id=${tabId}`, {
                method: 'POST',
                headers: {
                    'X-CSRFToken': csrfToken,
                },
                credentials: 'include'
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.message || `HTTP error! status: ${response.status}`);
            }

            const responseData = await response.json();
            if (responseData.message === "Logout successful") {
                if (responseData.csrf_token) {
                    document.cookie = `csrftoken=${responseData.csrf_token}; path=/; SameSite=Lax`;
                }
                sessionStorage.removeItem("user");
                sessionStorage.removeItem("tab_id");
                window.location.href = `/login/?tab_id=${tabId}`;
            } else {
                throw new Error(responseData.message || "Logout failed");
            }
        } catch (error) {
            console.error("Error during logout:", error);
            alert("Error during logout: " + error.message);
        }
    });
    </script>
</body>
</html>
