<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ParkShare</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/signup.css' %}">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-6 right text-center">
                <h2>Sign up now</h2>
                <p>Fill in the form below to get instant access</p>
                <form id="signup-form" class="w-100">
                    {% csrf_token %}
                    <div class="form-group mb-3">
                        <div class="row">
                            <div class="col-12 col-md-6">
                                <input type="text" id="first_name" placeholder="First Name" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="text" id="last_name" placeholder="Last Name" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <div class="row">
                            <div class="col-12">
                                <input type="email" id="username" placeholder="Email" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <div class="row">
                            <div class="col-12">
                                <input type="text" id="phone_number" placeholder="Phone Number" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <div class="row">
                            <div class="col-12 col-md-6">
                                <input type="password" id="password" placeholder="Password" required>
                            </div>
                            <div class="col-12 col-md-6">
                                <input type="password" id="confirm_password" placeholder="Confirm Password" required>
                            </div>
                        </div>
                    </div>
                    <div class="form-group mb-3">
                        <div class="row">
                            <div class="col-12">
                                <select id="role">
                                    <option value="driver">Driver</option>
                                    <option value="owner">Owner</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
                <div class="links text-center mt-3">
                    <p>or</p>
                    <a href="{% url 'login' %}">Log in here</a>
                </div>
            </div>
        </div>
    </div>
    <script>
    document.getElementById('signup-form').addEventListener('submit', function(event) {
        event.preventDefault();
        console.log("Form submitted!");
        const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
        console.log("CSRF Token:", csrfToken);
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirm_password').value;
        if (password !== confirmPassword) {
            alert("Passwords do not match. Please try again.");
            return;
        }
        const data = {
            first_name: document.getElementById('first_name').value,
            last_name: document.getElementById('last_name').value,
            username: document.getElementById('username').value,
            phone_number: document.getElementById('phone_number').value,
            password: password,
            confirm_password: confirmPassword,
            role: document.getElementById('role').value,
        };
        console.log("Form Data:", data);
        fetch('/api/register/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken,
            },
            body: JSON.stringify(data),
        })
        .then(response => {
            if (!response.ok) {
                return response.json().then(data => {
                    let errorMessage = "Registration failed due to the following errors:\n";
                    if (data.error) {
                        errorMessage += `${data.error}\n`;
                    }
                    if (data.errors) {
                        for (const field in data.errors) {
                            data.errors[field].forEach(error => {
                                errorMessage += `${field}: ${error}\n`;
                            });
                        }
                    }
                    alert(errorMessage.trim());
                });
            } else {
                console.log('Success:', data);
                alert('Registration successful!');
                window.location.href = "{% url 'login' %}";
            }
        })
        .catch((error) => {
            console.error('Error:', error);
            alert('Registration failed due to a server error. Please try again.');
        });
    });
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
