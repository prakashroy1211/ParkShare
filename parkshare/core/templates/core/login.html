<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkShare - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: row;
            height: 100vh;
            background-color: #f9f9f9;
        }

        .left-section, .right-section {
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .left-section {
            background-color: #fff;
        }

        .left-section img {
            max-width: 80%;
            height: auto;
        }

        .right-section {
            background-color: #f9f9f9;
        }

        .form-container {
            width: 80%;
            max-width: 400px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 14px;
            margin-bottom: 20px;
            color: #666;
        }

        .form-container input {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }

        .form-container button {
            width: 100%;
            padding: 12px;
            background-color: #d90429;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .form-container button:hover {
            background-color: #a70321;
        }

        .alternative {
            text-align: center;
            margin-top: 20px;
        }

        .alternative a {
            color: #d90429;
            text-decoration: none;
        }

        .alternative a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="left-section">
        <img src="{% static 'images/Girl.png' %}" alt="Phone Mockup">
    </div>

    <div class="right-section">
        <div class="form-container">
            <h1>Login to ParkShare</h1>
            <p>Enter email and password</p>

            <form id="login-form">
                {% csrf_token %}
                <input type="email" id="username" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>

            <div class="alternative">
                <p>Don't have an account? <a href="{% url 'signup' %}">Sign up here</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async function(event) {
            event.preventDefault();  // Prevent default form submission
        
            const data = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value,
            };
        
            try {
                const response = await fetch('/api/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]')?.value || '',
                    },
                    body: JSON.stringify(data),
                    credentials: 'include'  // Ensures session cookie is sent with the request
                });
        
                const responseData = await response.json();
                console.log("Response Data:", responseData);
        
                if (response.status === 200) {
                    //alert("Login successful!");
        
                    // Store user session data
                    localStorage.setItem("user", JSON.stringify(responseData));
        
                    // Handle role-based redirection
                    const roles = responseData.roles || [];
                    if (roles.includes("driver") && roles.includes("owner")) {
                        window.location.href = "{% url 'role_selection' %}";  // Redirect to role selection page
                    } else if (roles.includes("driver")) {
                        window.location.href = "{% url 'book_parking_space' %}";  // Redirect to Driver's home page
                    } else if (roles.includes("owner")) {
                        window.location.href = "{% url 'add_parking_space' %}";  // Redirect to Owner's home page
                    } else {
                        alert("No valid roles found. Please contact support.");
                    }
                } else {
                    alert("Login failed: " + JSON.stringify(responseData.errors));
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Login failed due to a server error.");
            }
        });
        </script>
        
</body>
</html>
