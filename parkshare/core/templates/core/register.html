<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | ParkShare</title>
    <style>
        /* General Styling */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f8f8;
        }

        /* Main Container */
        .container {
            display: flex;
            width: 90%;
            max-width: 1200px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            position: relative; /* Ensure logo is positioned relative to the container */
        }

        /* Left Side (Image) */
        .left {
            flex: 1;
            background: url('{% static "images/frame.png" %}') no-repeat center center;
            background-size: contain;
        }

        /* Right Side (Form) */
        .right {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* Logo at the top left of the entire container */
        .logo {
            position: absolute;
            top: 20px;
            left: 20px;
            max-width: 120px;
            height: auto;
        }

        .right h2 {
            font-size: 28px;
            margin-bottom: 10px;
            text-align: center;
        }

        .right p {
            font-size: 16px;
            color: #555;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Radio Buttons */
        .radio-group {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .radio-group input {
            margin-right: 5px;
        }

        /* Form Inputs */
        .form-group {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
            justify-content: center;
        }

        .form-group input {
            flex: 1;
            padding: 10px 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            background-color: #f9f9f9;
        }

        /* Button */
        .btn {
            width: 100%;
            padding: 10px;
            background-color: #d90429;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn:hover {
            background-color: #b00322;
        }

        /* Links */
        .links {
            text-align: center;
            margin-top: 15px;
        }

        .links a {
            text-decoration: none;
            color: #d90429;
            font-weight: bold;
        }

        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Left Side -->
        <div class="left"></div>

        <!-- Right Side (Form) -->
        <div class="right">
            <!-- Logo at the top left corner of the entire container -->
            <img src="{% static 'images/Slice 1.png' %}" alt="ParkShare Logo" class="logo">

            <h2>Sign up now</h2>
            <p>Fill in the form below to get instant access</p>

            <form method="POST" action="{% url 'core:register' %}">
                {% csrf_token %}
                <!-- Radio Buttons -->
                <div class="radio-group">
                    <label><input type="radio" name="role" value="user" required> User</label>
                    <label><input type="radio" name="role" value="owner" required> Owner</label>
                </div>

                <!-- Form Inputs -->
                <div class="form-group">
                    <input type="text" name="first_name" placeholder="Name" required>
                    <input type="text" name="last_name" placeholder="Surname" required>
                </div>
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" name="password1" placeholder="Password" required>
                    <input type="password" name="password2" placeholder="Confirm password" required>
                </div>
                <div class="form-group">
                    <input type="text" name="phone" placeholder="Phone number" required>
                </div>

                <!-- Submit Button -->
                <button type="submit" class="btn">Sign up</button>
            </form>

            <!-- Login Link -->
            <div class="links">
                <p>or</p>
                <a href="{% url 'core:user_login' %}">Log in here</a>
            </div>
        </div>
    </div>
</body>
</html>
