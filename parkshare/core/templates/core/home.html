<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkShare - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* Global Styles */
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #a70321;
            padding: 40px;
            text-align: center;
            color: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 2px;
        }

        nav {
            background-color: #343a40;
            padding: 10px;
            text-align: center;
        }

        nav a {
            font-size: 16px;
            color: #ffffff;
            margin: 0 15px;
            text-decoration: none;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }

        nav a:hover {
            background-color: #a70321;
        }

        .container {
            padding: 30px;
            text-align: center;
        }

        footer {
            background-color: #343a40;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 2rem;
            }

            nav a {
                font-size: 14px;
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to ParkShare</h1>
    </header>
    <nav>
        <a href="{% url 'core:parking_space_list' %}">View Parking Spaces</a>
        <a href="{% url 'core:add_parking_space' %}">Add Parking Space</a>
        <a href="{% url 'core:user_login' %}">Login</a>
        <a href="{% url 'core:register' %}">Register</a> <!-- Register button added here -->
    </nav>
    <div class="container">
        <h2>Share and Find Parking Easily</h2>
        <p>Welcome to ParkShare, the platform that allows you to share your parking space and find available parking nearby. Start exploring today!</p>
    </div>
    <footer>
        <p>&copy; 2025 ParkShare. All rights reserved.</p>
    </footer>
</body>
</html>
