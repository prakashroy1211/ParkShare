<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Spaces</title>
</head>
<body>
    <h1>Parking Spaces</h1>
    
    {% if parking_spaces %}
        <ul>
            {% for space in parking_spaces %}
                <li>{{ space.name }} - {{ space.location }}</li>  <!-- Assuming your ParkingSpace model has name and location fields -->
            {% endfor %}
        </ul>
    {% else %}
        <p>No parking spaces available.</p>
    {% endif %}
</body>
</html>
