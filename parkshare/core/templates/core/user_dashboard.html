<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParkShare - Dashboard</title>
    <style>
        /* General Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f9f9f9;
            display: flex;
        }

        /* Left Navigation Bar */
        .nav-bar {
            width: 220px;
            background-color: #d90429;
            padding: 20px;
            position: fixed;
            top: 0;
            bottom: 0;
            color: white;
            font-size: 18px;
        }

        .nav-bar h2 {
            margin-bottom: 20px;
            color: white;
            font-size: 24px;
        }

        .nav-bar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 0;
            font-size: 16px;
            margin-bottom: 15px;
            transition: background-color 0.3s;
        }

        .nav-bar a:hover {
            background-color: #a70321;
            padding-left: 15px;
        }

        .nav-bar .active {
            background-color: #a70321;
            padding-left: 15px;
        }

        /* Dashboard Layout */
        .dashboard-content {
            margin-left: 240px;
            width: 100%;
            padding: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .top-bar input[type="text"] {
            padding: 8px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: 1px solid #ddd;
            width: 300px;
        }

        .top-bar button {
            background-color: #d90429;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
        }

        .top-bar button:hover {
            background-color: #a70321;
        }

        /* Profile Button */
        .profile-btn {
            background-color: #d90429;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .profile-btn:hover {
            background-color: #a70321;
        }

        /* Available Parking Slots */
        .available-parking {
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            border: 1px solid #ddd;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .available-parking h3 {
            margin-bottom: 20px;
            color: #333;
        }

        .parking-slot {
            padding: 10px;
            background-color: #d90429;
            color: white;
            border-radius: 5px;
            margin-bottom: 10px;
            text-align: center;
        }

        /* Map Section */
        .map-section {
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            height: 300px;
            position: relative;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        /* Flexbox Layout */
        .content-wrapper {
            display: flex;
            justify-content: space-between;
        }

        .left-section, .right-section {
            width: 48%;
        }
        .logout-container {
    display: flex;
    justify-content: flex-end; /* Pushes the button to the right */
    padding: 10px; /* Adds spacing */
}
        .logout-btn {
    background-color: #d90429;
    color: white;
    padding: 10px 15px;
    border: none;
    border-radius: 5px;
    font-size: 16px;
    cursor: pointer;
}

.logout-btn:hover {
    background-color: #a70321;
}
.user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
            position: absolute;
            top: 10px;
            right: 10px;
        }
        .user-profile img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
        }

    </style>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
</head>
<body>
    <!-- Left Navigation Bar -->
    <div class="nav-bar">
        <h2>ParkShare</h2>
        <a href="#">View Reservations</a>
        <a href="#">View Profile</a>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard-content">
        <!-- Top Bar with Search and Profile -->
        <div class="top-bar">
            <div class="search-bar">
                <input type="text" id="searchLocation" placeholder="Search Location..." />
                <button onclick="searchLocation()">Search</button>
            </div>
            
            <div class="user-profile">
                <img src="{% static 'images/user.png' %}" alt="User">
                <span>{{ user.username }}</span>
            </div>
        </div>
        <div class="logout-container">
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn">Logout</button>
            </form>
        </div>
        <!-- Dashboard Content Wrapper -->
        <div class="content-wrapper">
            <!-- Left Section: Available Parking Slots -->
            <div class="left-section">
                <div class="available-parking">
                    <h3>Available Parking Slots</h3>
                    <div class="parking-slot">Slot 1</div>
                    <div class="parking-slot">Slot 2</div>
                    <div class="parking-slot">Slot 3</div>
                    <div class="parking-slot">Slot 4</div>
                </div>
            </div>
            <!-- Right Section: Map Section with Leaflet -->
            <div class="right-section">
                <div class="map-section" id="mapContainer">
                    <div id="map"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Leaflet map
        var map = L.map('map').setView([11.2588, 75.7804], 13);

        // Add OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        // Add default marker
        L.marker([11.2588, 75.7804]).addTo(map)
            .bindPopup("Kozhikode, Kerala")
            .openPopup();

        // Search Location Function
        function searchLocation() {
            const searchQuery = document.getElementById('searchLocation').value;
            if (searchQuery) {
                const geocodeUrl = `https://nominatim.openstreetmap.org/search?format=json&q=${searchQuery}`;
                
                fetch(geocodeUrl)
                    .then(response => response.json())
                    .then(data => {
                        if (data && data.length > 0) {
                            const lat = data[0].lat;
                            const lon = data[0].lon;
                            map.setView([lat, lon], 13);
                            L.marker([lat, lon]).addTo(map)
                                .bindPopup(`${searchQuery}`)
                                .openPopup();
                        } else {
                            alert("Location not found");
                        }
                    });
            }
        }
        document.querySelector('.logout-btn').addEventListener('click', function() {
        localStorage.removeItem("user"); // Clear user session data
    });
    </script>
</body>
</html>
